# Private SANE config for experiments (use with SANE_CONFIG_DIR=$PWD/sane).
# Treat the S400 (07b3:0465) as the OpticSlim M12 family, whose PID 0412 the cism603/cism216 firmware descriptors carry.
usb 0x07b3 0x0465
override "plustek-opticslim-m12"
firmware "/media/user/data/ScannerPlustek/vendor/windows_s400/extracted/Data/74RU/cism603.fw"
